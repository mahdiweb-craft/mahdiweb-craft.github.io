name: Günlük Otomatik Blog

on:
  schedule:
    # Her gün saat 04:00 UTC (Türkiye saatiyle 07:00) çalışır
    - cron: '0 4 * * *'
  workflow_dispatch: # Manuel çalıştırmak için

permissions:
  contents: write

jobs:
  update-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Kütüphaneleri Yükle
        run: pip install -r requirements.txt

      - name: Blog Botunu Çalıştır (Gemini + SEO + IndexNow)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/auto_blog.py

      - name: Sitemap ve RSS Feed'i Güncelle
        run: python scripts/generate_feeds.py

      - name: Yeni Resimleri Optimize Et (WebP)
        run: python scripts/optimize_images.py

      - name: Değişiklikleri Kaydet ve Gönder
        run: |
          git config --global user.name "WebFlux Bot"
          git config --global user.email "bot@webflux.com.tr"
          # Dosya yoksa bile hata vermemesi için her komut ayrı ayrı ve güvenli
          git add blog.html || true
          git add sitemap.xml || true
          git add feed.xml || true
          git add requirements.txt || true
          [ -d images ] && git add images/ || true
          # Değişiklik varsa commit at, yoksa sessizce geç
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Otomatik: Blog, Sitemap, RSS ve Resim Optimizasyonu"
          git push